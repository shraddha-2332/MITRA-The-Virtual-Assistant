name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check && npm test && npm run evaluate && npm run evaluate:public -- --strict
        working-directory: backend
      - run: npm test && npm run lint && npm run build
        working-directory: frontend
      - run: npx --no-install playwright-core install --with-deps chrome
        working-directory: frontend
      - run: npm run test:public-session-browser && npm run test:maintainer-browser
        working-directory: frontend
